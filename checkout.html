<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Lovely Bites</title>
    <style>
        :root { --brand-red: #e31e24; --bg-cream: #fffdf5; }
        body { font-family: sans-serif; background: var(--bg-cream); padding: 20px; }
        .checkout-box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--brand-red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #ccc; }
        .payment-label { font-weight: bold; margin-top: 10px; display: block; color: #333; font-size: 14px; }
    </style>
</head>
<body>

<main class="checkout-box">
    <h2>Delivery Details</h2>
    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="text" id="address1" placeholder="Flat/House No" required>
    <input type="text" id="address2" placeholder="Street/Locality" required>
    <input type="text" id="city" placeholder="City" required>
    <input type="number" id="pincode" placeholder="Pincode" required>
    <input type="number" id="phone" placeholder="Mobile Number" required>
    
    <label class="payment-label" for="paymentMethod">Select Payment Method:</label>
    <select id="paymentMethod">
        <option value="online">Online Payment (UPI / Card - Simulated)</option>
        <option value="cod">Cash on Delivery (COD)</option>
    </select>
    
    <button type="button" id="order-btn" onclick="initiateCheckout()">PLACE ORDER</button>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="firebase-init.js"></script>

<script>
    let authUser = null;
    firebase.auth().onAuthStateChanged((user) => { authUser = user; });

    async function initiateCheckout() {
        if (!authUser) { 
            alert("Please login first!"); 
            window.location.href = "login.html"; 
            return; 
        }

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const address1 = document.getElementById('address1').value;
        const address2 = document.getElementById('address2').value;
        const city = document.getElementById('city').value;
        const pincode = document.getElementById('pincode').value;
        const paymentMethod = document.getElementById('paymentMethod').value;

        if (!name || !email || !address1 || !city || !pincode || !phone) {
            alert("Kripya sabhi details bhariye!");
            return;
        }

        const btn = document.getElementById('order-btn');
        btn.disabled = true;
        btn.innerText = "Processing Order...";

        try {
            const db = firebase.firestore();
            const cartRef = db.collection("users").doc(authUser.uid).collection("cart");
            const cartSnapshot = await cartRef.get();
            
            if (cartSnapshot.empty) { 
                alert("Aapka cart khaali hai!"); 
                btn.disabled = false; 
                btn.innerText = "PLACE ORDER"; 
                return; 
            }

            let orderItems = [], totalAmount = 0;
            cartSnapshot.forEach(doc => {
                const item = doc.data();
                const subtotal = parseFloat(item.price) * parseInt(item.qty);
                orderItems.push({ productName: item.productName, qty: item.qty, price: item.price });
                totalAmount += subtotal;
            });

            // Save order directly based on selected payment method
            const paymentInfo = paymentMethod === 'cod' 
                ? { paymentMethod: "COD", paymentStatus: "Pending" } 
                : { paymentMethod: "Online", paymentStatus: "Success", paymentId: "TXN_" + Date.now() };

            await saveOrderToFirestore({
                ...paymentInfo,
                status: "Pending",
                items: orderItems,
                total: totalAmount,
                name, email, phone, address: `${address1}, ${address2}, ${city} - ${pincode}`
            });

        } catch (e) { 
            console.error(e);
            alert("Error: " + e.message); 
            btn.disabled = false; 
            btn.innerText = "PLACE ORDER";
        }
    }

    async function saveOrderToFirestore(orderData) {
        const db = firebase.firestore();
        const counterRef = db.collection("counters").doc("orderCounter");
        const cartRef = db.collection("users").doc(authUser.uid).collection("cart");
        const cartSnapshot = await cartRef.get();

        // Transaction for Sequential Order ID
        await db.runTransaction(async (transaction) => {
            const counterDoc = await transaction.get(counterRef);
            let currentLastId = 0;
            if (counterDoc.exists) {
                currentLastId = counterDoc.data().lastOrderId || 0;
            }
            const newOrderId = currentLastId + 1;

            transaction.set(db.collection("orders").doc(), {
                ...orderData,
                orderId: newOrderId,
                userId: authUser.uid,
                deliveryDate: null,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            if (counterDoc.exists) {
                transaction.update(counterRef, { lastOrderId: newOrderId });
            } else {
                transaction.set(counterRef, { lastOrderId: newOrderId });
            }
        });

        // Clear Cart
        const batch = db.batch();
        cartSnapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        alert("Order Successfully Placed!");
        window.location.href = "orders.html";
    }
</script>
</body>
</html>
