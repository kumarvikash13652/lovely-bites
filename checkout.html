<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Lovely Bites</title>
    <!-- Cashfree SDK Script Added -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        :root { --brand-red: #e31e24; --bg-cream: #fffdf5; --brand-blue: #0054a6; }
        body { font-family: sans-serif; background: var(--bg-cream); padding: 20px; }
        .checkout-box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--brand-red); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #ccc; }
        .payment-label { font-weight: bold; margin-top: 10px; display: block; color: #333; font-size: 14px; }
        .order-summary { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid var(--brand-blue); }
        .order-summary h4 { margin: 0 0 10px 0; color: var(--brand-blue); font-size: 16px; }
        .summary-total { font-weight: bold; font-size: 18px; color: var(--brand-red); margin-top: 10px; text-align: right; }
        
        /* Cashfree Simulator Modal Styles */
        #cashfree-simulator-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-content h3 { color: var(--brand-blue); margin-top: 0; }
        .modal-btn-success { background: #28a745; margin-top: 10px; }
        .modal-btn-fail { background: #dc3545; margin-top: 10px; }
    </style>
</head>
<body>

<main class="checkout-box">
    <h2>Delivery Details</h2>
    
    <div class="order-summary">
        <h4>Order Summary</h4>
        <div id="summary-items">Loading items...</div>
        <div class="summary-total" id="summary-total">Total: ₹0</div>
    </div>

    <input type="text" id="name" placeholder="Full Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="text" id="address1" placeholder="Flat/House No" required>
    <input type="text" id="address2" placeholder="Street/Locality" required>
    <input type="text" id="city" placeholder="City" required>
    <input type="number" id="pincode" placeholder="Pincode" required>
    <input type="number" id="phone" placeholder="Mobile Number" required>
    
    <label class="payment-label" for="paymentMethod">Select Payment Method:</label>
    <select id="paymentMethod">
        <option value="online">Online Payment (Cashfree Sandbox)</option>
        <option value="cod">Cash on Delivery (COD)</option>
    </select>
    
    <button type="button" id="order-btn" onclick="initiateCheckout()">PLACE ORDER</button>
</main>

<!-- Cashfree Simulator Modal Popup -->
<div id="cashfree-simulator-modal">
    <div class="modal-content">
        <h3>Cashfree Sandbox Simulator</h3>
        <p>Choose payment simulation result for your order:</p>
        <button class="modal-btn-success" onclick="simulatePaymentResponse(true)">Simulate Payment Success</button>
        <button class="modal-btn-fail" onclick="simulatePaymentResponse(false)">Simulate Payment Failure</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="firebase-init.js"></script>

<script>
    const cashfree = Cashfree({ mode: "sandbox" });
    let authUser = null;
    let pendingOrderPayload = null;

    firebase.auth().onAuthStateChanged(async (user) => { 
        authUser = user; 
        if (user) {
            loadCartSummary();
        } else {
            alert("Please login first!");
            window.location.href = "login.html";
        }
    });

    async function loadCartSummary() {
        try {
            const db = firebase.firestore();
            const cartRef = db.collection("users").doc(authUser.uid).collection("cart");
            const cartSnapshot = await cartRef.get();

            const summaryContainer = document.getElementById('summary-items');
            const totalContainer = document.getElementById('summary-total');

            if (cartSnapshot.empty) {
                summaryContainer.innerHTML = "Your cart is empty.";
                totalContainer.innerHTML = "Total: ₹0";
                return;
            }

            let html = "";
            let totalAmount = 0;

            cartSnapshot.forEach(doc => {
                const item = doc.data();
                const subtotal = parseFloat(item.price) * parseInt(item.qty);
                totalAmount += subtotal;
                html += `<div style="display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px;">
                    <span>${item.productName} (x${item.qty})</span>
                    <span>₹${subtotal}</span>
                </div>`;
            });

            summaryContainer.innerHTML = html;
            totalContainer.innerHTML = `Total: ₹${totalAmount}`;
        } catch (e) {
            console.error("Error loading cart summary:", e);
        }
    }

    async function initiateCheckout() {
        if (!authUser) { 
            alert("Please login first!"); 
            window.location.href = "login.html"; 
            return; 
        }

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const address1 = document.getElementById('address1').value;
        const address2 = document.getElementById('address2').value;
        const city = document.getElementById('city').value;
        const pincode = document.getElementById('pincode').value;
        const paymentMethod = document.getElementById('paymentMethod').value;

        if (!name || !email || !address1 || !city || !pincode || !phone) {
            alert("Kripya sabhi details bhariye!");
            return;
        }

        const btn = document.getElementById('order-btn');
        btn.disabled = true;
        btn.innerText = "Processing Order...";

        try {
            const db = firebase.firestore();
            const cartRef = db.collection("users").doc(authUser.uid).collection("cart");
            const cartSnapshot = await cartRef.get();
            
            if (cartSnapshot.empty) { 
                alert("Aapka cart khaali hai!"); 
                btn.disabled = false; 
                btn.innerText = "PLACE ORDER"; 
                return; 
            }

            let orderItems = [], totalAmount = 0;
            cartSnapshot.forEach(doc => {
                const item = doc.data();
                const subtotal = parseFloat(item.price) * parseInt(item.qty);
                orderItems.push({ productName: item.productName, qty: item.qty, price: item.price });
                totalAmount += subtotal;
            });

            const shippingDetails = {
                name, email, phone, address: `${address1}, ${address2}, ${city} - ${pincode}`
            };

            if (paymentMethod === 'cod') {
                await saveOrderToFirestore({
                    paymentMethod: "COD", 
                    paymentStatus: "Pending",
                    status: "Pending",
                    items: orderItems,
                    total: totalAmount,
                    ...shippingDetails
                });
            } else {
                // Save payload for simulator
                pendingOrderPayload = {
                    orderItems,
                    totalAmount,
                    shippingDetails
                };
                
                // Open Cashfree Simulator Modal instead of failing session
                document.getElementById('cashfree-simulator-modal').style.display = 'flex';
            }

        } catch (e) { 
            console.error(e);
            alert("Error: " + e.message); 
            btn.disabled = false; 
            btn.innerText = "PLACE ORDER";
        }
    }

    async function simulatePaymentResponse(isSuccess) {
        document.getElementById('cashfree-simulator-modal').style.display = 'none';
        const btn = document.getElementById('order-btn');

        if (!isSuccess) {
            alert("Payment failed by user simulation.");
            btn.disabled = false;
            btn.innerText = "PLACE ORDER";
            return;
        }

        try {
            await saveOrderToFirestore({
                paymentMethod: "Online", 
                paymentStatus: "Success", 
                paymentId: "TXN_SIM_" + Date.now(),
                status: "Pending",
                items: pendingOrderPayload.orderItems,
                total: pendingOrderPayload.totalAmount,
                ...pendingOrderPayload.shippingDetails
            });
        } catch (err) {
            console.error("Error saving online order:", err);
            alert("Error saving order: " + err.message);
            btn.disabled = false;
            btn.innerText = "PLACE ORDER";
        }
    }

    async function saveOrderToFirestore(orderData) {
        const db = firebase.firestore();
        const counterRef = db.collection("counters").doc("orderCounter");
        const cartRef = db.collection("users").doc(authUser.uid).collection("cart");
        const cartSnapshot = await cartRef.get();

        await db.runTransaction(async (transaction) => {
            const counterDoc = await transaction.get(counterRef);
            let currentLastId = 0;
            if (counterDoc.exists) {
                currentLastId = counterDoc.data().lastOrderId || 0;
            }
            const newOrderId = currentLastId + 1;

            transaction.set(db.collection("orders").doc(), {
                ...orderData,
                orderId: newOrderId,
                userId: authUser.uid,
                deliveryDate: null,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            if (counterDoc.exists) {
                transaction.update(counterRef, { lastOrderId: newOrderId });
            } else {
                transaction.set(counterRef, { lastOrderId: newOrderId });
            }
        });

        const batch = db.batch();
        cartSnapshot.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        alert("Order Successfully Placed!");
        window.location.href = "orders.html";
    }
</script>
</body>
</html>
